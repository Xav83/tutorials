---
name: Yaml linter

on: push # yamllint disable-line rule:truthy

jobs:
  build:
    strategy:
      matrix:
        os:
          [
            macos-15-large
            macos-15
            macos-14-large,
            macos-14,
            macos-13,
            macos-13-xlarge,
            ubuntu-22.04,
            ubuntu-20.04,
            windows-2022,
            windows-2019,
          ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Installs the latest version of Yamllint
        run: pip install yamllint
      - name: Runs yamllint on all the yaml file of the repository
        run: yamllint --strict .
